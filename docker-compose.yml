services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/criar_banco.sql:/docker-entrypoint-initdb.d/01_criar_banco.sql
      - ./sql/aluno1_camadas.sql:/docker-entrypoint-initdb.d/02_aluno1_camadas.sql
      - ./sql/criar_camada_gold.sql:/docker-entrypoint-initdb.d/03_criar_camada_gold.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - backend


  mongodb:
    image: mongo:8
    container_name: mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    networks:
      - backend


  hop-web:
    image: apache/hop-web:latest
    container_name: hop-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - HOP_SERVER_PORT=8080
      - HOP_PROJECT_NAME=desafio4
      - HOP_PROJECT_FOLDER=/files
      - HOP_PROJECT_CONFIG_FILE_NAME=project-config.json
      - HOP_ENVIRONMENT_NAME=desafio4-dev
      - HOP_ENVIRONMENT_CONFIG_FILE_NAME_PATHS=/files/environments/dev-env-config.json
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./hop:/files
      - ./dados:/dados
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend


  spark-job-server:
    image: apache/beam_spark_job_server:latest
    container_name: spark-job-server
    restart: unless-stopped
    ports:
      - "8099:8099"
      - "8098:8098"
    volumes:
      - ./dados:/dados
    networks:
      - backend


  superset:
    image: apache/superset:4.0.2
    container_name: superset
    restart: unless-stopped
    ports:
      - "${SUPERSET_PORT}:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - superset_home:/app/superset_home
      - ./dashboard:/app/dashboard
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    command: >
      /bin/sh -c "
        superset db upgrade &&
        superset fab create-admin --username $${SUPERSET_ADMIN_USERNAME} --firstname Admin --lastname Dev --email admin@ficdev.local --password $${SUPERSET_ADMIN_PASSWORD} || true &&
        superset init &&
        python /app/dashboard/sync_database.py || true &&
        /usr/bin/run-server.sh
      "


volumes:
  postgres_data:
  mongo_data:
  superset_home:


networks:
  backend:
    driver: bridge